version: '3.8'

# Порты публикуются только на 127.0.0.1: Docker обходит фаервол хоста, и 0.0.0.0 открыл бы базу и pgAdmin
# всей локальной сети. Бот на этом же хосте подключается к localhost:5432. Паролей по умолчанию нет:
# DB_USER, DB_PASSWORD, DB_NAME, PGADMIN_EMAIL, PGADMIN_PASSWORD должны быть в .env, иначе compose не запустится.
services:
  # PostgreSQL Database
  db:
    image: postgres:latest
    container_name: ${DB_CONTAINER_NAME:-postgres-db}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin - Database Management Interface (с входом по паролю, к базе — по docker-сети: хост `db`)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${PGADMIN_CONTAINER_NAME:-pgadmin}
    restart: always
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:?set PGADMIN_EMAIL in .env}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      - PGADMIN_CONFIG_SERVER_MODE=True
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
